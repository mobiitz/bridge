name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID != '' && secrets.VITE_WALLETCONNECT_PROJECT_ID || vars.VITE_WALLETCONNECT_PROJECT_ID || 'c642c78cac7906ea598d9f721d1f2bee' }}
      VITE_ETHEREUM_RPC_URL: ${{ secrets.VITE_ETHEREUM_RPC_URL != '' && secrets.VITE_ETHEREUM_RPC_URL || vars.VITE_ETHEREUM_RPC_URL }}
      VITE_ETHEREUM_FALLBACK_RPC_URL: ${{ secrets.VITE_ETHEREUM_FALLBACK_RPC_URL != '' && secrets.VITE_ETHEREUM_FALLBACK_RPC_URL || vars.VITE_ETHEREUM_FALLBACK_RPC_URL }}
      VITE_BASE_RPC_URL: ${{ secrets.VITE_BASE_RPC_URL != '' && secrets.VITE_BASE_RPC_URL || vars.VITE_BASE_RPC_URL }}
      VITE_BASE_FALLBACK_RPC_URL: ${{ secrets.VITE_BASE_FALLBACK_RPC_URL != '' && secrets.VITE_BASE_FALLBACK_RPC_URL || vars.VITE_BASE_FALLBACK_RPC_URL }}
      VITE_ETHEREUM_TOKEN_ADDRESS: ${{ secrets.VITE_ETHEREUM_TOKEN_ADDRESS != '' && secrets.VITE_ETHEREUM_TOKEN_ADDRESS || vars.VITE_ETHEREUM_TOKEN_ADDRESS || '0x3898257dd2cd6d2a3b6e3435f73568a725262b9b' }}
      VITE_BASE_TOKEN_ADDRESS: ${{ secrets.VITE_BASE_TOKEN_ADDRESS != '' && secrets.VITE_BASE_TOKEN_ADDRESS || vars.VITE_BASE_TOKEN_ADDRESS || '0x3898257dd2cd6d2a3b6e3435f73568a725262b9b' }}
      VITE_RELAYER_URL: ${{ secrets.VITE_RELAYER_URL != '' && secrets.VITE_RELAYER_URL || vars.VITE_RELAYER_URL }}
      VITE_BRIDGE_OPERATOR_ADDRESS: ${{ secrets.VITE_BRIDGE_OPERATOR_ADDRESS != '' && secrets.VITE_BRIDGE_OPERATOR_ADDRESS || vars.VITE_BRIDGE_OPERATOR_ADDRESS }}
      VITE_BRIDGE_REQUEST_TTL_SECONDS: ${{ secrets.VITE_BRIDGE_REQUEST_TTL_SECONDS != '' && secrets.VITE_BRIDGE_REQUEST_TTL_SECONDS || vars.VITE_BRIDGE_REQUEST_TTL_SECONDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Write Vite env file
        env:
          ENV_SECRET: ${{ secrets.ENV }}
          ENV_VAR: ${{ vars.ENV }}
          ENV_BLOB_SECRET: ${{ secrets.ENV_BLOB }}
          ENV_BLOB_VAR: ${{ vars.ENV_BLOB }}
        run: |
          : > .env.production

          if [ -n "$ENV_SECRET" ]; then
            printf '%s\n' "$ENV_SECRET" >> .env.production
          elif [ -n "$ENV_VAR" ]; then
            printf '%s\n' "$ENV_VAR" >> .env.production
          elif [ -n "$ENV_BLOB_SECRET" ]; then
            printf '%s\n' "$ENV_BLOB_SECRET" >> .env.production
          elif [ -n "$ENV_BLOB_VAR" ]; then
            printf '%s\n' "$ENV_BLOB_VAR" >> .env.production
          fi

          cat >> .env.production <<EOF
          VITE_WALLETCONNECT_PROJECT_ID=${VITE_WALLETCONNECT_PROJECT_ID}
          VITE_ETHEREUM_RPC_URL=${VITE_ETHEREUM_RPC_URL}
          VITE_ETHEREUM_FALLBACK_RPC_URL=${VITE_ETHEREUM_FALLBACK_RPC_URL}
          VITE_BASE_RPC_URL=${VITE_BASE_RPC_URL}
          VITE_BASE_FALLBACK_RPC_URL=${VITE_BASE_FALLBACK_RPC_URL}
          VITE_ETHEREUM_TOKEN_ADDRESS=${VITE_ETHEREUM_TOKEN_ADDRESS}
          VITE_BASE_TOKEN_ADDRESS=${VITE_BASE_TOKEN_ADDRESS}
          VITE_RELAYER_URL=${VITE_RELAYER_URL}
          VITE_BRIDGE_OPERATOR_ADDRESS=${VITE_BRIDGE_OPERATOR_ADDRESS}
          VITE_BRIDGE_REQUEST_TTL_SECONDS=${VITE_BRIDGE_REQUEST_TTL_SECONDS}
          EOF

      - name: Validate build env
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const envFile = '.env.production';
          const parsed = {};

          if (fs.existsSync(envFile)) {
            for (const line of fs.readFileSync(envFile, 'utf8').split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;
              const separatorIndex = trimmed.indexOf('=');
              if (separatorIndex === -1) continue;
              const key = trimmed.slice(0, separatorIndex).trim();
              const value = trimmed.slice(separatorIndex + 1).trim();
              parsed[key] = value;
            }
          }

          const getValue = (key) => process.env[key] || parsed[key] || '';
          const requiredKeys = [
            'VITE_WALLETCONNECT_PROJECT_ID',
            'VITE_ETHEREUM_TOKEN_ADDRESS',
            'VITE_BASE_TOKEN_ADDRESS',
            'VITE_RELAYER_URL',
            'VITE_BRIDGE_REQUEST_TTL_SECONDS',
          ];

          const missingKeys = requiredKeys.filter((key) => !getValue(key));

          if (missingKeys.length > 0) {
            console.error(`Missing required Vite build variables: ${missingKeys.join(', ')}`);
            process.exit(1);
          }

          console.log(`Validated Vite build env for: ${requiredKeys.join(', ')}`);
          EOF

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
